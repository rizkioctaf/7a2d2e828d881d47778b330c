<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Drive</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
  
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-area">
        <span class="material-icons-outlined logo-icon">cloud</span>
        <h2>CloudDrive</h2>
      </div>
      
      <button id="btn-new" class="btn-new">
        <span class="material-icons-outlined">add</span> Baru
      </button>

      <nav class="nav-menu">
        <a href="#" class="active"><span class="material-icons-outlined">folder</span> File Saya</a>
        <a href="#"><span class="material-icons-outlined">people</span> Dibagikan</a>
        <a href="#"><span class="material-icons-outlined">delete</span> Sampah</a>
      </nav>

      <div class="storage-meter">
        <p class="storage-text"><span id="storage-used">0 MB</span> / <span id="storage-total">10 GB</span> digunakan</p>
        <div class="progress-bar">
          <div class="progress-fill" id="storage-fill" style="width: 0%"></div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="drop-zone">
      <!-- Header -->
      <header class="top-header">
        <div class="search-box">
          <span class="material-icons-outlined search-icon">search</span>
          <input type="text" id="search-input" placeholder="Telusuri di Drive...">
        </div>
        <div class="header-actions">
          <button id="btn-toggle-view" class="icon-btn" title="Toggle View"><span class="material-icons-outlined">grid_view</span></button>
          <button id="btn-theme" class="icon-btn" title="Dark Mode"><span class="material-icons-outlined">dark_mode</span></button>
          <div class="profile-avatar">U</div>
        </div>
      </header>

      <!-- Toolbar & Breadcrumbs -->
      <div class="toolbar">
        <div class="breadcrumbs" id="breadcrumbs">
          <span data-path="" class="crumb">File Saya</span>
        </div>
        <div class="context-actions hidden" id="context-actions">
          <button id="btn-bulk-download" class="icon-btn"><span class="material-icons-outlined">download</span></button>
          <button id="btn-bulk-delete" class="icon-btn text-danger"><span class="material-icons-outlined">delete</span></button>
        </div>
      </div>

      <!-- File Area -->
      <div id="file-list-container" class="file-grid">
        <!-- File & Folder items di-render via JS -->
      </div>
      
      <div class="drop-overlay hidden" id="drop-overlay">
        <h2>Lepaskan file untuk mengunggah ke folder ini</h2>
      </div>
    </main>
  </div>

  <!-- Upload Floating Box -->
  <div class="upload-manager hidden" id="upload-manager">
    <div class="upload-header">
      <h4>Mengunggah <span id="upload-count">0</span> file</h4>
      <button id="btn-close-uploads" class="icon-btn"><span class="material-icons-outlined">close</span></button>
    </div>
    <div class="upload-list" id="upload-list">
      <!-- Item upload -->
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal hidden" id="preview-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="preview-title">Filename.ext</h3>
        <div class="modal-actions">
          <button id="btn-share" class="icon-btn"><span class="material-icons-outlined">share</span></button>
          <button id="btn-download-preview" class="icon-btn"><span class="material-icons-outlined">download</span></button>
          <button id="btn-close-preview" class="icon-btn"><span class="material-icons-outlined">close</span></button>
        </div>
      </div>
      <div class="modal-body" id="preview-container">
        <!-- Media renders here -->
      </div>
    </div>
  </div>

  <!-- Modul Aplikasi -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/preview.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
