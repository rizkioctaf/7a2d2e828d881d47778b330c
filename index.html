<!-- HALAMAN LOGIN / REGISTER -->
    <div id="auth-container" class="box">
        <h2 id="auth-title">Login ke Chat</h2>
        <form id="auth-form" class="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <!-- Kolom Kode Validasi (Default disembunyikan karena default-nya halaman login) -->
            <input type="text" id="validation-code" placeholder="Kode Validasi (Tanya Admin)" style="display: none;">
            
            <button type="submit" id="auth-btn">Masuk</button>
        </form>
        <span class="toggle-link" id="toggle-auth">Belum punya akun? Daftar disini</span>
    </div>

    <!-- HALAMAN CHAT -->
    <div id="chat-container" class="box">
        <div class="header">
            <h3>Halo, <span id="user-display"></span>!</h3>
            <div class="header-buttons">
                <button class="btn-secondary" onclick="logout()">Logout</button>
                <button class="btn-danger" onclick="deleteAccount()">Hapus Akun</button>
            </div>
        </div>
        <div id="chat-box">Memuat pesan...</div>
        <form id="chat-form" class="inputs">
            <input type="text" id="content" placeholder="Ketik pesan..." required autocomplete="off">
            <button type="submit">Kirim</button>
        </form>
    </div>

    <script>
        const authContainer = document.getElementById('auth-container');
        const chatContainer = document.getElementById('chat-container');
        const authForm = document.getElementById('auth-form');
        const toggleAuthBtn = document.getElementById('toggle-auth');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const validationCodeInput = document.getElementById('validation-code'); // Elemen baru
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userDisplay = document.getElementById('user-display');

        let isLoginMode = true;
        let currentUser = localStorage.getItem('username');
        let chatInterval;

        if (currentUser) {
            showChat();
        }

        // Toggle antara Login dan Register
        toggleAuthBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? "Login ke Chat" : "Daftar Akun Baru";
            authBtn.innerText = isLoginMode ? "Masuk" : "Daftar";
            toggleAuthBtn.innerText = isLoginMode ? "Belum punya akun? Daftar disini" : "Sudah punya akun? Login disini";
            
            // Munculkan kolom validasi hanya saat Register
            if (isLoginMode) {
                validationCodeInput.style.display = 'none';
                validationCodeInput.required = false;
            } else {
                validationCodeInput.style.display = 'block';
                validationCodeInput.required = true;
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const validationCode = document.getElementById('validation-code').value; // Ambil nilai validasi
            
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

            authBtn.innerText = "Tunggu...";
            authBtn.disabled = true;

            // Siapkan payload (data yang dikirim ke backend)
            const payload = { username, password };
            // Hanya kirim kode validasi jika sedang melakukan pendaftaran
            if (!isLoginMode) {
                payload.validationCode = validationCode;
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    if (isLoginMode) {
                        localStorage.setItem('username', data.username);
                        currentUser = data.username;
                        showChat();
                    } else {
                        alert("Pendaftaran berhasil! Silakan login.");
                        toggleAuthBtn.click();
                        document.getElementById('password').value = '';
                        document.getElementById('validation-code').value = ''; // Bersihkan kode validasi
                    }
                } else {
                    alert("Error: " + data.error); // Menampilkan "Kode validasi salah. Silakan hubungi admin."
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan.");
            }

            authBtn.innerText = isLoginMode ? "Masuk" : "Daftar";
            authBtn.disabled = false;
        });

        function showChat() {
            authContainer.style.display = 'none';
            chatContainer.style.display = 'block';
            userDisplay.innerText = currentUser;
            
            fetchMessages();
            chatInterval = setInterval(fetchMessages, 3000);
        }

        function logout() {
            localStorage.removeItem('username');
            currentUser = null;
            clearInterval(chatInterval);
            
            chatContainer.style.display = 'none';
            authContainer.style.display = 'block';
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('validation-code').value = '';
        }

        async function deleteAccount() {
            const confirmDelete = confirm("Apakah kamu yakin ingin menghapus akun ini secara permanen? Semua akses akan hilang.");
            if (confirmDelete) {
                try {
                    const res = await fetch('/api/auth/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUser })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert("Akun berhasil dihapus!");
                        logout(); 
                    } else {
                        alert("Gagal menghapus akun: " + data.error);
                    }
                } catch (err) {
                    alert("Terjadi kesalahan jaringan.");
                }
            }
        }

        async function fetchMessages() {
            try {
                const res = await fetch('/api/messages');
                const messages = await res.json();
                chatBox.innerHTML = '';
                messages.reverse().forEach(msg => {
                    const time = new Date(msg.timestamp).toLocaleTimeString('id-ID');
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `<strong>${msg.sender}</strong><span class="meta">${time}</span><br><span>${msg.content}</span>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Gagal memuat pesan", err);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('content').value;
            document.getElementById('content').value = ''; 
            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUser, content })
            });
            fetchMessages(); 
        });
    </script>
