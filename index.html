<!DOCTYPE html>
<html>
<head><title>Web Artikel</title></head>
<body>
    <h1>Daftar Artikel</h1>
    <nav>
        <a href="login.html">Login/Register</a> | 
        <a href="write.html" id="writeLink" style="display:none;">Tulis Artikel</a>
    </nav>
    <hr>
    <div id="articles">Loading...</div>

    <script>
        // Cek login status
        if(localStorage.getItem('username')) {
            document.getElementById('writeLink').style.display = 'inline';
        }

        // Ambil data artikel
        fetch('/api/articles')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('articles');
                container.innerHTML = '';
                data.forEach(art => {
                    container.innerHTML += `
                        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
                            <h2><a href="view.html?id=${art.id}">${art.title}</a></h2>
                            <p><strong>Kategori:</strong> ${art.category} | <strong>Penulis:</strong> ${art.author}</p>
                            <p>${art.preview}</p>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
