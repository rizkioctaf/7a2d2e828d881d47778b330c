<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Akun Forum</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .form-section { display: none; margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        .active { display: block; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .password-container { display: flex; align-items: center; }
        .toggle-btn { margin-left: -60px; z-index: 10; cursor: pointer; background: none; border: none; font-size: 12px; }
        button.action-btn { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button.action-btn:hover { background-color: #0056b3; }
        .nav-buttons button { margin: 5px 0; }
        .forum-section { display: none; margin-top: 20px; }
        .article-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .article-card h4 { margin: 0 0 10px 0; }
        .article-meta { font-size: 12px; color: gray; margin-bottom: 10px; }
        .btn-small { padding: 5px 10px; font-size: 12px; margin-right: 5px; cursor: pointer; }
        .btn-edit { background-color: #ffc107; border: none; }
        .btn-delete { background-color: #dc3545; color: white; border: none; }
        textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; height: 100px; }
        .char-counter { font-size: 12px; color: gray; text-align: right; margin-bottom: 10px; }
        .btn-new-post { background-color: #28a745; color: white; padding: 10px; border: none; width: 100%; margin-bottom: 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-cancel { background-color: #6c757d; color: white; margin-top: 10px; }
        textarea { resize: vertical; height: 150px; }
        .comments-section { background: #f9f9f9; padding: 15px; margin-top: 10px; border-radius: 5px; display: none; }
        .comment-box { border-left: 2px solid #ccc; padding-left: 10px; margin-top: 15px; }
        .reply-btn { font-size: 11px; color: #007bff; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; margin-top: 5px; }
        .reply-input-area { margin-top: 10px; display: none; }
        .reply-input-area textarea { height: 60px; }
    </style>
</head>
<body>

    <h2>Aplikasi Forum</h2>
    
    <div class="nav-buttons">
        <button onclick="showSection('login')">Login</button>
        <button onclick="showSection('register')">Buat Akun</button>
        <button onclick="showSection('forgot')">Lupa Password</button>
        <button onclick="showSection('change')">Ubah Password</button>
        <button onclick="showSection('delete')">Hapus Akun</button>
    </div>

    <!-- Login -->
    <div id="login" class="form-section active">
        <h3>Login</h3>
        <input type="text" id="login-username" placeholder="Username">
        <div class="password-container">
            <input type="password" id="login-password" placeholder="Password">
            <button class="toggle-btn" onclick="togglePassword('login-password')">Lihat</button>
        </div>
        <button class="action-btn" onclick="submitForm('/api/login', {username: 'login-username', password: 'login-password'})">Login</button>
    </div>

    <!-- Register -->
    <div id="register" class="form-section">
        <h3>Buat Akun</h3>
        <input type="text" id="reg-username" placeholder="Username (Huruf & Angka)">
        <div class="password-container">
            <input type="password" id="reg-password" placeholder="Password">
            <button class="toggle-btn" onclick="togglePassword('reg-password')">Lihat</button>
        </div>
        <input type="text" id="reg-code" placeholder="Kode Validasi (CREATE_CODE)">
        <button class="action-btn" onclick="submitForm('/api/register', {username: 'reg-username', password: 'reg-password', createCode: 'reg-code'})">Daftar</button>
    </div>

    <!-- Forgot Password -->
    <div id="forgot" class="form-section">
        <h3>Lupa Password</h3>
        <input type="text" id="forgot-username" placeholder="Username">
        <div class="password-container">
            <input type="password" id="forgot-new-password" placeholder="Password Baru">
            <button class="toggle-btn" onclick="togglePassword('forgot-new-password')">Lihat</button>
        </div>
        <input type="text" id="forgot-code" placeholder="Kode Validasi (FORGOT_CODE)">
        <button class="action-btn" onclick="submitForm('/api/forgot', {username: 'forgot-username', newPassword: 'forgot-new-password', forgotCode: 'forgot-code'})">Reset Password</button>
    </div>

    <!-- Change Password -->
    <div id="change" class="form-section">
        <h3>Ubah Password</h3>
        <input type="text" id="change-username" placeholder="Username">
        <div class="password-container">
            <input type="password" id="change-old-password" placeholder="Password Lama">
            <button class="toggle-btn" onclick="togglePassword('change-old-password')">Lihat</button>
        </div>
        <div class="password-container">
            <input type="password" id="change-new-password" placeholder="Password Baru">
            <button class="toggle-btn" onclick="togglePassword('change-new-password')">Lihat</button>
        </div>
        <button class="action-btn" onclick="submitForm('/api/change-password', {username: 'change-username', oldPassword: 'change-old-password', newPassword: 'change-new-password'})">Update Password</button>
    </div>

    <!-- Delete Account -->
    <div id="delete" class="form-section">
        <h3>Hapus Akun</h3>
        <input type="text" id="delete-username" placeholder="Username">
        <div class="password-container">
            <input type="password" id="delete-password" placeholder="Password (Verifikasi)">
            <button class="toggle-btn" onclick="togglePassword('delete-password')">Lihat</button>
        </div>
        <button class="action-btn" style="background-color: red;" onclick="submitForm('/api/delete-account', {username: 'delete-username', password: 'delete-password'})">Hapus Akun Permanen</button>
    </div>

    <!-- TAMPILAN TIMELINE (DAFTAR POSTINGAN) -->
    <div id="forum-list" class="form-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Beranda (<span id="currentUser"></span>)</h3>
            <button onclick="logout()" class="btn-small btn-delete">Logout</button>
        </div>
        
        <button class="btn-new-post" onclick="openEditor()">+ Buat Postingan Baru</button>

        <div id="articles-list">
            <!-- Artikel akan dimuat di sini -->
        </div>
    </div>

    <!-- TAMPILAN EDITOR (HANYA UNTUK CREATE) -->
    <div id="forum-editor" class="form-section">
        <h3>Tulis Postingan</h3>
        <textarea id="article-content" maxlength="2000" placeholder="Apa yang sedang Anda pikirkan? (Maksimal 2000 karakter)" oninput="updateCounter()"></textarea>
        <div id="char-count" class="char-counter">0 / 2000</div>
        <!-- Input Media Baru -->
        <div style="margin-bottom: 15px;">
            <label for="article-media" style="font-size: 14px; display: block; margin-bottom: 5px;">Upload Media (Opsional, Maks 50MB):</label>
            <input type="file" id="article-media" accept="image/*,video/*,audio/*">
        </div>
        
        <button class="action-btn" onclick="saveArticle()">Terbitkan</button>
        <button class="action-btn btn-cancel" onclick="closeEditor()">Batal</button>
    </div>

    <script>
        // Navigasi antar form
        function showSection(id) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Fitur Toggle Lihat Password
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        // (UPDATE FUNGSI SUBMIT FORM SEBELUMNYA)
        async function submitForm(endpoint, fieldMappings) {
            const payload = {};
            for (const [key, elementId] of Object.entries(fieldMappings)) {
                payload[key] = document.getElementById(elementId).value;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert('Sukses: ' + data.message);
                    
                    // --- TAMBAHAN UNTUK LOGIN ---
                    if(endpoint === '/api/login') {
                        localStorage.setItem('sessionUser', payload.username);
                        localStorage.setItem('sessionPass', payload.password);
                        checkSession(); // Masuk ke forum
                    }
                } else {
                    alert('Gagal: ' + data.error);
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi.');
            }
        }

        // --- LOGIKA FORUM (CRUD) ---
// --- LOGIKA FORUM (TIMELINE & EDITOR SAJA) ---

        function checkSession() {
            const user = localStorage.getItem('sessionUser');
            if (user) {
                document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
                document.getElementById('forum-list').classList.add('active'); // Tampilkan Timeline
                document.querySelector('.nav-buttons').style.display = 'none';
                document.getElementById('currentUser').innerText = user;
                loadArticles();
            }
        }

        function logout() {
            localStorage.removeItem('sessionUser');
            localStorage.removeItem('sessionPass');
            location.reload();
        }

        function updateCounter() {
            const content = document.getElementById('article-content').value;
            document.getElementById('char-count').innerText = `${content.length} / 2000`;
        }

        function openEditor() {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.getElementById('forum-editor').classList.add('active'); // Tampilkan Editor
            document.getElementById('article-content').value = ''; // Kosongkan form
            updateCounter();
        }

        function closeEditor() {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.getElementById('forum-list').classList.add('active'); // Kembali ke Timeline
        }

        // READ: Muat artikel tanpa tombol aksi
        async function loadArticles() {
            const res = await fetch('/api/articles/list');
            const data = await res.json();
            const listDiv = document.getElementById('articles-list');
            listDiv.innerHTML = '';

            data.data.forEach(article => {
                const date = new Date(article.created_at).toLocaleString('id-ID');
                
                // Menyiapkan HTML untuk Media jika ada
                let mediaHTML = '';
                if (article.media_url) {
                    const mediaSrc = `/api/media/${article.media_url}`;
                    if (article.media_type === 'image') {
                        mediaHTML = `<img src="${mediaSrc}" style="max-width:100%; border-radius:5px; margin-top:10px;">`;
                    } else if (article.media_type === 'video') {
                        mediaHTML = `<video src="${mediaSrc}" controls style="max-width:100%; border-radius:5px; margin-top:10px;"></video>`;
                    } else if (article.media_type === 'audio') {
                        mediaHTML = `<audio src="${mediaSrc}" controls style="width:100%; margin-top:10px;"></audio>`;
                    }
                }
                
                listDiv.innerHTML += `
                    <div class="article-card">
                        <div class="article-meta"><b>@${article.username}</b> • ${date}</div>
                        <div style="margin-top: 8px;">${article.content.replace(/\n/g, '<br>')}</div>
                        
                        <!-- Area Media -->
                        ${mediaHTML}
                        
                        <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                            <!-- TAMPILKAN JUMLAH KOMENTAR DI SINI -->
                            <button class="btn-small" onclick="toggleComments(${article.id})">💬 Komentar (${article.comment_count})</button>
                        </div>

                        <!-- Area Komentar ... (kode sebelumnya tetap sama) -->
                        <div id="comments-section-${article.id}" class="comments-section">
                            <div id="comments-list-${article.id}"></div>
                            <div style="margin-top: 15px;">
                                <textarea id="comment-input-${article.id}" placeholder="Tulis komentar... (Maks 500 karakter)" style="height:60px;"></textarea>
                                <button class="btn-small btn-new-post" style="width: auto; padding: 8px 15px;" onclick="submitComment(${article.id}, null)">Kirim Komentar</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            if (data.data.length === 0) listDiv.innerHTML = '<p style="text-align:center; color:gray;">Belum ada postingan.</p>';
        }

        // Buka/Tutup area komentar & muat datanya
        async function toggleComments(articleId) {
            const section = document.getElementById(`comments-section-${articleId}`);
            if (section.style.display === 'block') {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            await fetchComments(articleId);
        }

        // Ambil komentar dari API
        async function fetchComments(articleId) {
            const listDiv = document.getElementById(`comments-list-${articleId}`);
            listDiv.innerHTML = '<span style="font-size:12px;">Memuat komentar...</span>';
            
            const res = await fetch(`/api/comments/list?article_id=${articleId}`);
            const data = await res.json();
            
            if (data.data.length === 0) {
                listDiv.innerHTML = '<span style="font-size:12px; color:gray;">Belum ada komentar.</span>';
                return;
            }

            // Render menjadi struktur bersarang (tree)
            listDiv.innerHTML = renderCommentTree(data.data, articleId, null);
        }

        // Fungsi Rekursif untuk mencetak balasan bertingkat
        function renderCommentTree(comments, articleId, parentId) {
            let html = '';
            // Filter komentar yang induknya sama dengan parentId
            const children = comments.filter(c => c.parent_id === parentId);
            
            children.forEach(c => {
                html += `
                    <div class="comment-box">
                        <div class="article-meta"><b>@${c.username}</b> • ${new Date(c.created_at).toLocaleString('id-ID')}</div>
                        <div style="margin-top: 5px; font-size:14px;">${c.content.replace(/\n/g, '<br>')}</div>
                        
                        <button class="reply-btn" onclick="document.getElementById('reply-area-${c.id}').style.display='block'">Balas</button>
                        
                        <!-- Form Balasan Spesifik -->
                        <div id="reply-area-${c.id}" class="reply-input-area">
                            <textarea id="reply-input-${c.id}" placeholder="Balas @${c.username}..."></textarea>
                            <button class="btn-small" onclick="submitComment(${articleId}, ${c.id})">Kirim</button>
                            <button class="btn-small btn-cancel" onclick="document.getElementById('reply-area-${c.id}').style.display='none'">Batal</button>
                        </div>

                        <!-- Render anak komentarnya (rekursif) -->
                        <div style="margin-left: 5px;">
                            ${renderCommentTree(comments, articleId, c.id)}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        // Kirim Komentar atau Balasan
        async function submitComment(articleId, parentId) {
            const username = localStorage.getItem('sessionUser');
            const password = localStorage.getItem('sessionPass');
            
            // Ambil input dari form utama ATAU form balasan
            const inputId = parentId ? `reply-input-${parentId}` : `comment-input-${articleId}`;
            const content = document.getElementById(inputId).value;

            if (!content.trim()) return alert("Komentar tidak boleh kosong!");

            try {
                const res = await fetch('/api/comments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ article_id: articleId, parent_id: parentId, username, password, content })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById(inputId).value = ''; // Kosongkan input
                    await fetchComments(articleId); // Muat ulang komentar
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) {
                alert("Terjadi kesalahan.");
            }
        }

        // CREATE: Simpan artikel baru
        async function saveArticle() {
            const content = document.getElementById('article-content').value;
            const mediaInput = document.getElementById('article-media');
            const username = localStorage.getItem('sessionUser');
            const password = localStorage.getItem('sessionPass');

            if(!content.trim()) return alert("Konten tidak boleh kosong!");
            if(content.length > 2000) return alert("Konten melebihi batas!");
            if(mediaInput.files[0] && mediaInput.files[0].size > 50 * 1024 * 1024) return alert("Ukuran file maksimal 50MB!");

            const btn = document.querySelector('#forum-editor .action-btn');
            btn.disabled = true;
            btn.innerText = "Mengunggah... (Mohon tunggu)";

            // Menggunakan FormData
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('content', content);
            
            if (mediaInput.files.length > 0) {
                formData.append('media', mediaInput.files[0]);
            }

            try {
                const res = await fetch('/api/articles/create', {
                    method: 'POST',
                    // HAPUS headers 'Content-Type' agar browser mengatur boundary Multipart otomatis
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    closeEditor();
                    document.getElementById('article-media').value = ''; // Reset input file
                    loadArticles(); 
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) {
                alert("Terjadi kesalahan koneksi.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Terbitkan";
            }
        }

        // Cek sesi saat halaman pertama kali dimuat
        window.onload = checkSession;
    </script>
</body>
</html>
