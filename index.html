<!DOCTYPE html>
<html>
<head><title>Web Artikel</title></head>
<body>
    <h1>Daftar Artikel</h1>
    <nav>
        <span id="auth-links"><a href="login.html">Login / Register</a></span>
        <span id="user-menu" style="display:none;">
            Halo, <strong id="user-name"></strong> | 
            <a href="write.html">Tulis Artikel</a> | 
            <button onclick="logout()">Logout</button>
        </span>
    </nav>
    <hr>
    <div id="articles">Loading...</div>

    <script>
        // Cek login status
        const currentUser = localStorage.getItem('username');
        if(currentUser) {
            document.getElementById('auth-links').style.display = 'none';
            document.getElementById('user-menu').style.display = 'inline';
            document.getElementById('user-name').innerText = currentUser;
        }

        function logout() {
            localStorage.removeItem('username');
            window.location.reload(); // Refresh halaman setelah logout
        }

        // Ambil data artikel (tanpa preview)
        fetch('/api/articles')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('articles');
                container.innerHTML = '';
                data.forEach(art => {
                    container.innerHTML += `
                        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
                            <h2><a href="view.html?id=${art.id}" onclick="return checkLogin(event)">${art.title}</a></h2>
                            <p><strong>Kategori:</strong> ${art.category} | <strong>Penulis:</strong> ${art.author}</p>
                        </div>
                    `;
                });
            });

        // Fungsi memblokir klik judul jika belum login
        function checkLogin(event) {
            if (!localStorage.getItem('username')) {
                event.preventDefault(); // Mencegah pindah ke halaman view
                alert("Anda harus login terlebih dahulu untuk membaca artikel ini!");
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
