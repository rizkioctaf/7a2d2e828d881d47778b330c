<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare D1 Chat dengan Auth & Hapus Akun</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f4f9; }
        
        .box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        
        #auth-container { text-align: center; }
        .auth-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        
        #chat-container { display: none; }
        #chat-box { height: 350px; overflow-y: auto; padding-right: 10px; margin-bottom: 15px; border-bottom: 1px solid #ddd; }
        
        .message { margin-bottom: 15px; }
        .meta { font-size: 0.75em; color: #888; margin-left: 8px; }
        
        .inputs { display: flex; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; }
        #content { flex-grow: 1; }
        
        button { padding: 10px 15px; background: #0051c3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        button:hover { background: #003682; }
        
        .btn-danger { background: #d93025; }
        .btn-danger:hover { background: #b3261e; }
        .btn-secondary { background: #5f6368; }
        .btn-secondary:hover { background: #3c4043; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-buttons { display: flex; gap: 5px; }
        
        .toggle-link { color: #0051c3; cursor: pointer; text-decoration: underline; font-size: 0.9em; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN / REGISTER -->
    <div id="auth-container" class="box">
        <h2 id="auth-title">Login ke Chat</h2>
        <form id="auth-form" class="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="auth-btn">Masuk</button>
        </form>
        <span class="toggle-link" id="toggle-auth">Belum punya akun? Daftar disini</span>
    </div>

    <!-- HALAMAN CHAT -->
    <div id="chat-container" class="box">
        <div class="header">
            <h3>Halo, <span id="user-display"></span>!</h3>
            <div class="header-buttons">
                <button class="btn-secondary" onclick="logout()">Logout</button>
                <button class="btn-danger" onclick="deleteAccount()">Hapus Akun</button>
            </div>
        </div>
        <div id="chat-box">Memuat pesan...</div>
        <form id="chat-form" class="inputs">
            <input type="text" id="content" placeholder="Ketik pesan..." required autocomplete="off">
            <button type="submit">Kirim</button>
        </form>
    </div>

    <script>
        const authContainer = document.getElementById('auth-container');
        const chatContainer = document.getElementById('chat-container');
        const authForm = document.getElementById('auth-form');
        const toggleAuthBtn = document.getElementById('toggle-auth');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userDisplay = document.getElementById('user-display');

        let isLoginMode = true;
        let currentUser = localStorage.getItem('username');
        let chatInterval;

        if (currentUser) {
            showChat();
        }

        toggleAuthBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? "Login ke Chat" : "Daftar Akun Baru";
            authBtn.innerText = isLoginMode ? "Masuk" : "Daftar";
            toggleAuthBtn.innerText = isLoginMode ? "Belum punya akun? Daftar disini" : "Sudah punya akun? Login disini";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

            authBtn.innerText = "Tunggu...";
            authBtn.disabled = true;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    if (isLoginMode) {
                        localStorage.setItem('username', data.username);
                        currentUser = data.username;
                        showChat();
                    } else {
                        alert("Pendaftaran berhasil! Silakan login.");
                        toggleAuthBtn.click();
                        document.getElementById('password').value = '';
                    }
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan.");
            }

            authBtn.innerText = isLoginMode ? "Masuk" : "Daftar";
            authBtn.disabled = false;
        });

        function showChat() {
            authContainer.style.display = 'none';
            chatContainer.style.display = 'block';
            userDisplay.innerText = currentUser;
            
            fetchMessages();
            chatInterval = setInterval(fetchMessages, 3000);
        }

        function logout() {
            localStorage.removeItem('username');
            currentUser = null;
            clearInterval(chatInterval);
            
            chatContainer.style.display = 'none';
            authContainer.style.display = 'block';
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // FUNGSI BARU: Menghapus Akun
        async function deleteAccount() {
            const confirmDelete = confirm("Apakah kamu yakin ingin menghapus akun ini secara permanen? Semua akses akan hilang.");
            
            if (confirmDelete) {
                try {
                    const res = await fetch('/api/auth/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUser })
                    });

                    const data = await res.json();
                    
                    if (res.ok) {
                        alert("Akun berhasil dihapus!");
                        logout(); // Panggil fungsi logout untuk kembali ke layar login
                    } else {
                        alert("Gagal menghapus akun: " + data.error);
                    }
                } catch (err) {
                    alert("Terjadi kesalahan jaringan.");
                }
            }
        }

        async function fetchMessages() {
            try {
                const res = await fetch('/api/messages');
                const messages = await res.json();
                
                chatBox.innerHTML = '';
                messages.reverse().forEach(msg => {
                    const time = new Date(msg.timestamp).toLocaleTimeString('id-ID');
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `<strong>${msg.sender}</strong><span class="meta">${time}</span><br><span>${msg.content}</span>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Gagal memuat pesan", err);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('content').value;
            document.getElementById('content').value = ''; 

            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUser, content })
            });

            fetchMessages(); 
        });
    </script>
</body>
</html>
