<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC Retro Chat</title>
    
    <!-- Library Markdown & Pembersih XSS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    
    <style>
    :root { --bg: #ffffff; --text: #333333; --border: #e0e0e0; --accent: #000000; }
    body { 
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; 
        max-width: 700px; margin: 40px auto; padding: 20px; 
        background: var(--bg); color: var(--text); line-height: 1.6;
    }
    .box { background: #fff; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    
    /* Layout IRC */
    .message-wrapper { display: flex; gap: 15px; margin-bottom: 12px; font-size: 14px; }
    .avatar { width: 32px; height: 32px; flex-shrink: 0; border: 1px solid var(--border); }
    .meta { color: #999; font-size: 0.8em; }
    .username { font-weight: bold; color: var(--accent); }
    
    /* Input & UI */
    input, textarea { 
        width: 100%; border: 1px solid var(--border); padding: 10px; 
        font-family: inherit; outline: none; border-radius: 0;
    }
    button { 
        background: var(--accent); color: #fff; border: none; 
        padding: 10px 20px; cursor: pointer; text-transform: uppercase; font-weight: bold;
    }
    button:hover { opacity: 0.8; }
    
    /* Markdown Minimalis */
    .markdown-body pre { background: #f6f6f6; padding: 10px; border: 1px solid var(--border); }
    .markdown-body code { background: #f6f6f6; padding: 2px 4px; }
    
    /* Header & Nav */
    .header { border-bottom: 2px solid var(--accent); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    h2, h3 { text-transform: uppercase; letter-spacing: -1px; margin: 0; }
</style>
</head>
<body>
    <div id="notification"></div>

    <div id="auth-container" class="box">
        <h2 id="auth-title">/*** LOGIN ***/</h2>
        <form id="auth-form" class="auth-form">
            <input type="text" id="username" placeholder=">_ USERNAME" required autocomplete="username">
            <input type="password" id="password" placeholder=">_ PASSWORD" required autocomplete="current-password">
            <input type="text" id="validation-code" placeholder=">_ KODE_VALIDASI" style="display: none;">
            <input type="text" id="reset-code" placeholder=">_ KODE_RESET" style="display: none;">
            <button type="submit" id="auth-btn">EXECUTE</button>
        </form>
        <div><span class="toggle-link" id="toggle-auth">[Daftar Akun Baru]</span></div>
        <div><span class="toggle-link" id="toggle-reset" style="color: #ff3333;">[Lupa Password]</span></div>
    </div>

    <div id="settings-container" class="box">
        <div class="header">
            <h3 style="margin: 0;">/SETTINGS</h3>
            <button class="btn-secondary" onclick="closeSettings()">RETURN</button>
        </div>
        <h4>>_ CHANGE USERNAME</h4>
        <form id="edit-username-form" class="inputs">
            <input type="text" id="new-username" placeholder=">_ NEW_USERNAME" required>
            <button type="submit">SAVE</button>
        </form>
        <h4>>_ CHANGE PASSWORD</h4>
        <form id="change-password-form" class="auth-form" style="margin-bottom: 0;">
            <input type="password" id="old-password" placeholder=">_ OLD_PASSWORD" required>
            <input type="password" id="new-password" placeholder=">_ NEW_PASSWORD" required>
            <button type="submit">UPDATE</button>
        </form>
        <hr style="border: 0; border-top: 1px dashed #33ff33; margin: 25px 0;">
        <button class="btn-danger" onclick="deleteAccount()" style="width: 100%;">!!! DELETE ACCOUNT !!!</button>
    </div>

    <div id="chat-container" class="box">
        <div class="header">
            <h3 style="margin: 0;">/CHANNEL #GENERAL - &lt;<span id="user-display"></span>&gt;</h3>
            <div class="header-buttons">
                <button class="btn-secondary" onclick="openSettings()">SET</button>
                <button class="btn-danger" onclick="logout()">EXIT</button>
            </div>
        </div>
        <div id="chat-box">Memuat log sistem...</div>
        
        <form id="chat-form" class="inputs" style="margin-bottom: 0;">
            <textarea id="content" placeholder=">_ Ketik pesan (Markdown didukung). Shift+Enter untuk baris baru." required></textarea>
            <button type="submit" id="send-btn">SEND</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
