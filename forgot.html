<!DOCTYPE html>
<html>
<head>
    <title>Lupa Password</title>
</head>
<body>
    <h1>Reset Password</h1>
    <p>Masukkan username Anda dan password baru yang Anda inginkan.</p>
    
    <input type="text" id="username" placeholder="Username Anda"><br><br>
    <input type="password" id="new-password" placeholder="Password Baru"><br><br>
    
    <button onclick="resetPassword()">Reset Password</button>
    <br><br>
    <a href="login.html">← Batal, kembali ke Login</a>

    <script>
        async function resetPassword() {
            const user = document.getElementById('username').value;
            const newPass = document.getElementById('new-password').value;
            
            if(!user || !newPass) {
                alert("Data tidak boleh kosong!");
                return;
            }

            const res = await fetch(`/api/auth?action=forgot_password`, {
                method: 'POST',
                body: JSON.stringify({ username: user, new_password: newPass })
            });

            if (res.ok) {
                alert("Password berhasil direset! Silakan login dengan password baru.");
                window.location.href = 'login.html';
            } else {
                alert("Username tidak ditemukan.");
            }
        }
    </script>
</body>
</html>
