<!DOCTYPE html>
<html>
<head>
    <title>Login / Register</title>
    <script>
        // Jika sudah login, langsung pindahkan ke halaman utama (index)
        if (localStorage.getItem('username')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <h1>Login atau Buat Akun</h1>
    <p>Anda wajib login untuk mengakses website ini.</p>
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="auth('login')">Login</button>
    <button onclick="auth('register')">Register</button>
    <br><br>
    <a href="forgot.html">Lupa Password?</a>

    <script>
        async function auth(action) {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if(!user || !pass) {
                alert("Username dan Password tidak boleh kosong!");
                return;
            }
            
            const res = await fetch(`/api/auth?action=${action}`, {
                method: 'POST',
                body: JSON.stringify({username: user, password: pass})
            });

            if (res.ok) {
                if (action === 'login') {
                    localStorage.setItem('username', user);
                    window.location.href = 'index.html'; // Sukses login, masuk ke index
                } else {
                    alert('Register sukses! Silakan klik Login untuk masuk.');
                }
            } else {
                alert("Gagal. Pastikan username/password benar atau username belum dipakai.");
            }
        }
    </script>
</body>
</html>
